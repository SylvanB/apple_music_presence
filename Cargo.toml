[package]
name = "apple_music_presence"
version = "0.1.0"
edition = "2021"
description = "A macOS daemon that reports Apple Music playback to Discord Rich Presence"
license = "MIT"
repository = "https://github.com/SylvanB/apple_music_presence"
keywords = ["apple-music", "discord", "rich-presence", "macos"]
categories = ["command-line-utilities"]

[dependencies]
discord-presence = "3.2.0"
reqwest = { version = "0.12.4", features = ["blocking", "json"] }
serde = { version = "1.0.202", features = ["derive"] }
serde_json = "1.0.117"
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
tracing-appender = "0.2.5"
